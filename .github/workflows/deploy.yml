name: CI/CD Production Deploy (Afalina)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-audit:
    name: Перевірка структури та збірка артефактів
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Перевірка наявності ключових файлів релізу
        run: |
          test -f index.html
          test -f booking.html
          test -f styles.css
          test -f main.js
          echo "Усі файли продакшн-збірки перевірено успішно!"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Production Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    name: Автоматичний реліз у хмару
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-audit
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4